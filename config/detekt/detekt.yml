build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  LongMethod:
    active: true
    threshold: 100
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
  NestedBlockDepth:
    active: true
    threshold: 4

coroutines:
  InjectDispatcher:
    active: false
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException
  TooGenericExceptionCaught:
    # 오류 결과로 변환하는 경계에서는 포괄 예외 처리를 허용합니다.
    active: false
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - IndexOutOfBoundsException
      - NullPointerException
      - RuntimeException
      - Throwable

potential-bugs:
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true

naming:
  NoNameShadowing:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnnecessaryAbstractClass:
    active: false
  WildcardImport:
    active: true
